<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INTERCOP Digital — Prototipo Onboarding Refactorizado</title>
    <style>
        :root {
            --navy: #002D59;
            --navy-dark: #001B36;
            --navy-surface: #0A3D73;
            --capri: #00AEEA;
            --capri-light: #E0F4FC;
            --capri-soft: #F0F9FD;
            --magenta: #E94591;
            --yellow: #FFC700;
            --white: #FFFFFF;
            --bg: #F4F9FD;
            --border: #BCE2F7;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --success: #10B981;
            --success-light: #ECFDF5;
            --warning: #F59E0B;
            --danger: #EF4444;
            --danger-light: #FEF2F2;
            --shadow-sm: 0 2px 8px rgba(0, 45, 89, 0.06);
            --shadow-md: 0 8px 24px rgba(0, 45, 89, 0.12);
            --shadow-lg: 0 16px 40px rgba(0, 45, 89, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-shell {
            width: 100%;
            max-width: 420px;
            background: #FFFFFF;
            border-radius: 0;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .app-shell {
                min-height: 840px;
                max-height: 840px;
                border-radius: 40px;
                border: 8px solid var(--navy);
                margin: 20px;
            }
        }

        .app-header {
            padding: 12px 18px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #F1F5F9;
            background: #FFF;
            position: relative;
            z-index: 20;
        }

        .app-mini-logo {
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--navy);
        }

        .app-mini-logo span {
            color: var(--capri);
        }

        .step-badge {
            background: var(--capri-light);
            color: var(--navy);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 12px;
            min-width: 44px;
            text-align: center;
        }

        .progress-wrapper {
            position: relative;
            background: #FFFFFF;
            z-index: 19;
        }

        .progress-track {
            height: 7px;
            background: #E2E8F0;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .progress-indicator {
            height: 100%;
            background: linear-gradient(90deg, #FFC700 0%, #00AEEA 50%, #002D59 100%);
            width: 0%;
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            border-radius: 0 4px 4px 0;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 174, 234, 0.4);
        }

        .progress-indicator::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 100%);
            animation: progressShimmer 2.2s infinite;
        }

        @keyframes progressShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-watermark {
            position: absolute;
            right: 12px;
            top: 9px;
            font-size: 0.62rem;
            font-weight: 800;
            color: var(--navy);
            opacity: 0.35;
            pointer-events: none;
            letter-spacing: 0.2px;
            z-index: 15;
        }

        /* Z-INDEX 250 PARA MOSTRAR TOASTS INCLUSO SOBRE EL OVERLAY DE SELFIE */
        .step-toast-container {
            position: absolute;
            top: 56px;
            right: 14px;
            left: 14px;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 250;
        }

        .step-toast {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #FFFFFF;
            color: #0047AB;
            padding: 7px 14px 7px 9px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            border: 1.5px solid #7BA7E1;
            transform: translateY(-16px) scale(0.95);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.28s ease, border-color 0.25s ease;
            min-width: 245px;
            max-width: 94%;
        }

        .step-toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
            pointer-events: auto;
        }

        .step-toast-left {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .step-toast-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .step-toast-close {
            background: transparent;
            border: none;
            color: #9E9E9E;
            font-size: 1.15rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 2px;
            margin-left: 6px;
            font-weight: 400;
            flex-shrink: 0;
            transition: color 0.2s ease;
        }

        .step-toast-close:hover {
            color: #475569;
        }

        .app-body {
            flex: 1;
            padding: 20px 18px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background: #FAFCFF;
            position: relative;
        }

        .step-title {
            font-size: 1.22rem;
            font-weight: 900;
            color: var(--navy);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .step-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.35;
        }

        .form-group {
            margin-bottom: 9px;
        }

        .form-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 4px;
            text-transform: none;
        }

        .form-input {
            width: 100%;
            min-height: 42px;
            padding: 8px 12px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.86rem;
            color: var(--navy);
            background: #FFFFFF;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: var(--capri);
            box-shadow: 0 0 0 3px rgba(0, 174, 234, 0.15);
        }

        .form-input[readonly] {
            background-color: #F1F5F9;
            color: #334155;
        }

        select.form-input {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23002D59' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        .btn-action-primary {
            min-height: 46px;
            background: var(--navy);
            color: var(--white);
            border: none;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.25s ease;
            box-shadow: 0 4px 12px rgba(0,45,89,0.2);
            text-decoration: none;
        }

        .btn-action-primary:active {
            transform: scale(0.98);
        }

        .btn-action-capri {
            min-height: 46px;
            background: var(--capri);
            color: var(--white);
            border: none;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(0, 174, 234, 0.28);
            text-decoration: none;
        }

        .btn-action-capri:active {
            transform: scale(0.98);
        }

        .btn-action-yellow {
            min-height: 44px;
            background: var(--yellow);
            color: var(--navy);
            border: none;
            border-radius: 14px;
            font-size: 0.86rem;
            font-weight: 900;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255,199,0,0.3);
            text-decoration: none;
        }

        .btn-action-outline {
            min-height: 40px;
            background: transparent;
            color: var(--navy);
            border: 1.5px solid var(--navy);
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .info-card {
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
        }

        .kv-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #E2E8F0;
            font-size: 0.8rem;
        }

        .kv-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .kv-key {
            color: var(--text-muted);
            font-weight: 700;
        }

        .kv-val {
            color: var(--navy);
            font-weight: 800;
            text-align: right;
        }

        /* BOTONES HORIZONTALES DE TOKEN MÁS PEQUEÑOS, ATRACTIVOS Y DINÁMICOS */
        .token-channel-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .token-channel-btn {
            padding: 5px 10px;
            border-radius: 999px;
            border: 1.5px solid #BAE6FD;
            background: linear-gradient(180deg, #FFFFFF 0%, #F0F9FF 100%);
            color: var(--navy);
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(0, 45, 89, 0.06);
            white-space: nowrap;
        }

        .token-channel-btn:hover {
            transform: translateY(-2px);
            border-color: var(--capri);
            box-shadow: 0 4px 10px rgba(0, 174, 234, 0.18);
        }

        .token-channel-btn:active {
            transform: scale(0.94);
        }

        .token-channel-btn.active {
            background: linear-gradient(135deg, var(--navy) 0%, var(--capri) 100%);
            color: #FFFFFF;
            border-color: transparent;
            transform: translateY(-1px) scale(1.03);
            box-shadow: 0 4px 12px rgba(0, 174, 234, 0.35);
        }

        .token-channel-btn .token-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #CBD5E1;
            transition: all 0.25s ease;
        }

        .token-channel-btn.active .token-dot {
            background: var(--yellow);
            box-shadow: 0 0 6px var(--yellow);
        }

        .dpi-scanner-box {
            background: #071324;
            border-radius: 20px;
            padding: 16px 14px;
            text-align: center;
            margin: 8px 0 14px;
            position: relative;
            color: #FFFFFF;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .dpi-viewfinder-frame {
            width: 100%;
            max-width: 320px;
            height: 195px;
            margin: 0 auto;
            border-radius: 14px;
            border: 2.5px solid rgba(0, 174, 234, 0.45);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0F2542 0%, #040B16 100%);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .dpi-viewfinder-frame.scanning {
            border-color: var(--capri);
            box-shadow: 0 0 15px rgba(0,174,234,0.35);
        }

        .dpi-viewfinder-frame.success {
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(16,185,129,0.45);
        }

        .camera-video-feed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        .camera-capture-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            display: none;
        }

        .camera-clean-reticle {
            position: relative;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: rgba(224, 244, 252, 0.65);
            font-size: 0.7rem;
            font-weight: 700;
        }

        .camera-clean-crosshair {
            width: 36px;
            height: 36px;
            border: 1.5px dashed rgba(0, 174, 234, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-clean-crosshair::after {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--capri);
        }

        .camera-flash-overlay {
            position: absolute;
            inset: 0;
            background: #FFFFFF;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
            transition: opacity 0.2s ease;
        }

        .camera-flash-overlay.flash {
            opacity: 0.9;
        }

        .scanner-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: var(--success);
            box-shadow: 0 0 12px var(--success);
            top: 10%;
            display: none;
            z-index: 6;
            animation: scanAnim 1.8s infinite ease-in-out;
        }

        @keyframes scanAnim {
            0% { top: 10%; }
            50% { top: 90%; }
            100% { top: 10%; }
        }

        .dpi-corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: var(--yellow);
            border-style: solid;
            z-index: 5;
            pointer-events: none;
        }

        .dpi-corner.top-left { top: 8px; left: 8px; border-width: 4px 0 0 4px; border-top-left-radius: 10px; }
        .dpi-corner.top-right { top: 8px; right: 8px; border-width: 4px 4px 0 0; border-top-right-radius: 10px; }
        .dpi-corner.bottom-left { bottom: 8px; left: 8px; border-width: 0 0 4px 4px; border-bottom-left-radius: 10px; }
        .dpi-corner.bottom-right { bottom: 8px; right: 8px; border-width: 0 4px 4px 0; border-bottom-right-radius: 10px; }

        .facephi-stage {
            background: #FFFFFF;
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 16px 14px;
            text-align: center;
            margin: 6px 0 12px;
            box-shadow: var(--shadow-sm);
        }

        .oval-radar {
            width: 150px;
            height: 182px;
            border: 4px solid var(--capri);
            border-radius: 50% / 60% 60% 40% 40%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 174, 234, 0.2);
            background: #071324;
        }

        .scanner-beam {
            position: absolute;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--capri);
            box-shadow: 0 0 12px var(--capri);
            top: 10%;
            z-index: 6;
            animation: scanAnim 1.8s infinite ease-in-out;
        }

        .selfie-blur-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 27, 54, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 150;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            animation: fadeSelfieIn 0.3s ease;
        }

        .selfie-blur-overlay.active {
            display: flex;
        }

        @keyframes fadeSelfieIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .selfie-spotlight-circle {
            width: 225px;
            height: 225px;
            border-radius: 50%;
            border: 5px solid var(--capri);
            box-shadow: 0 0 0 8px rgba(0, 174, 234, 0.2), 0 16px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at center, #0F2542 0%, #040B16 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .selfie-spotlight-circle.scanning {
            border-color: var(--yellow);
            box-shadow: 0 0 0 10px rgba(255, 199, 0, 0.25), 0 0 30px rgba(0, 174, 234, 0.6);
        }

        .selfie-spotlight-circle.success {
            border-color: var(--success);
            box-shadow: 0 0 0 10px rgba(16, 185, 129, 0.3), 0 0 35px rgba(16, 185, 129, 0.65);
        }

        .selfie-capture-btn {
            min-height: 48px;
            padding: 10px 26px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--capri), #0088B8);
            color: var(--white);
            font-size: 0.92rem;
            font-weight: 900;
            border: 3px solid var(--white);
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 174, 234, 0.45);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .selfie-capture-btn:active {
            transform: scale(0.96);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #CBD5E1;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--success);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .chip-option {
            padding: 8px 14px;
            background: #FFFFFF;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--navy);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            display: inline-block;
            margin: 0 6px 8px 0;
        }

        .chip-option.selected {
            background: var(--capri-soft);
            border-color: var(--capri);
            color: var(--navy);
            box-shadow: 0 2px 8px rgba(0,174,234,0.2);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 45, 89, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 20px;
        }

        .modal-box {
            background: #FFFFFF;
            border-radius: 24px;
            max-width: 380px;
            width: 100%;
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .admin-report-overlay {
            position: fixed;
            inset: 0;
            background: #F1F5F9;
            z-index: 9500;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 58px 20px 40px;
        }

        .admin-report-overlay.active {
            display: flex;
        }

        .admin-container {
            max-width: 980px;
            width: 100%;
            margin: 0 auto;
        }

        .admin-header-banner {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-surface) 100%);
            color: #FFF;
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .admin-card {
            background: #FFF;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid #E2E8F0;
            box-shadow: var(--shadow-sm);
        }

        .admin-card-title {
            font-size: 0.88rem;
            font-weight: 900;
            color: var(--navy);
            border-bottom: 2px solid var(--capri-light);
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .admin-photo-box {

        // GESTIÓN DE CÁMARA
        function stopActiveCamera() {
            isCameraLiveActive = false;
            if (activeCameraStream) {
                activeCameraStream.getTracks().forEach(track => track.stop());
                activeCameraStream = null;
            }
        }

        async function startStepCamera(videoId, facingModeType) {
            stopActiveCamera();
            const videoEl = document.getElementById(videoId);
            if (!videoEl) return false;

            videoEl.muted = true;
            videoEl.defaultMuted = true;
            videoEl.setAttribute("playsinline", "true");
            videoEl.setAttribute("webkit-playsinline", "true");
            videoEl.setAttribute("autoplay", "true");

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return false;
            }

            const constraintAttempts = [
                { video: { facingMode: { exact: facingModeType }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: { facingMode: { ideal: facingModeType }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
                { video: { facingMode: facingModeType }, audio: false },
                { video: true, audio: false }
            ];

            for (const constraints of constraintAttempts) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    activeCameraStream = stream;
                    videoEl.srcObject = stream;
                    videoEl.style.display = "block";

                    await new Promise((resolve) => {
                        let resolved = false;
                        const finish = () => { if (!resolved) { resolved = true; resolve(); } };
                        videoEl.onloadedmetadata = () => { videoEl.play().then(finish).catch(finish); };
                        setTimeout(finish, 900);
                    });

                    await videoEl.play().catch(() => {});
                    isCameraLiveActive = true;
                    return true;
                } catch (err) {}
            }
            return false;
        }

        function handleAndroidNativeCameraFile(inputEl, isFrontSelfie) {
            if (!inputEl || !inputEl.files || !inputEl.files[0]) return;
            const file = inputEl.files[0];
            const reader = new FileReader();
            reader.onload = function(evt) {
                const dataUrl = evt.target.result;
                if (isFrontSelfie || currentStep === 8) {
                    procesarSelfieDesdeDataUrl(dataUrl);
                } else if (currentStep === 4) {
                    procesarDpiDesdeDataUrl(true, dataUrl);
                } else if (currentStep === 5) {
                    procesarDpiDesdeDataUrl(false, dataUrl);
                }
            };
            reader.readAsDataURL(file);
        }

        function captureFrameToCanvas(videoId, canvasId, mirrorHorizontal = false) {
            const videoEl = document.getElementById(videoId);
            const canvasEl = document.getElementById(canvasId);
            if (!videoEl || !canvasEl || !videoEl.srcObject || videoEl.readyState < 2) {
                return false;
            }
            const w = videoEl.videoWidth || 480;
            const h = videoEl.videoHeight || 320;
            canvasEl.width = w;
            canvasEl.height = h;
            const ctx = canvasEl.getContext("2d");
            ctx.save();
            if (mirrorHorizontal) {
                ctx.translate(w, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(videoEl, 0, 0, w, h);
            ctx.restore();
            canvasEl.style.display = "block";
            return true;
        }

        function createCleanCapturedDpiDataUrl(tipoLado) {
            const c = document.createElement("canvas");
            c.width = 480;
            c.height = 300;
            const ctx = c.getContext("2d");

            const bg = ctx.createLinearGradient(0, 0, 480, 300);
            bg.addColorStop(0, "#07162C");
            bg.addColorStop(1, "#0D2B52");
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, 480, 300);

            ctx.strokeStyle = "#00AEEA";
            ctx.lineWidth = 3;
            ctx.strokeRect(24, 24, 432, 252);

            ctx.fillStyle = "#10B981";
            ctx.font = "bold 15px sans-serif";
            ctx.fillText("✓ CAPTURA ÓPTICA VERIFICADA — " + tipoLado, 45, 65);

            ctx.fillStyle = "#FFFFFF";
            ctx.font = "bold 18px sans-serif";
            ctx.fillText(session.datosPersonales.nombre || "DOCUMENTO DPI CAPTURADO", 45, 115);

            ctx.fillStyle = "#E0F4FC";
            ctx.font = "14px monospace";
            if (tipoLado === "FRENTE") {
                ctx.fillText("CUI: " + (session.datosPersonales.cui || "LECTURA ÓPTICA FRENTE"), 45, 150);
                ctx.fillText("NAC: " + (session.datosPersonales.fNac || "--/--/----") + " | SEXO: " + (session.datosPersonales.sexo || "--"), 45, 178);
                ctx.fillText("SERIE: " + (session.datosPersonales.serie || "OCR-ACTIVO"), 45, 206);
            } else {
                ctx.fillText("VECINDAD: " + (session.datosPersonales.vecindad || "LECTURA ÓPTICA REVERSO"), 45, 150);
                ctx.fillText("EMISIÓN: " + (session.datosPersonales.emision || "--/--/----") + " | VENCE: " + (session.datosPersonales.vencimiento || "--/--/----"), 45, 178);
                ctx.fillText("MRZ: IDGTM<<<<<<<<<<<<<<<<<<<<<<<", 45, 206);
            }

            ctx.fillStyle = "#FFC700";
            ctx.font = "bold 12px sans-serif";
            ctx.fillText("INTERCOP DIGITAL • SELLO OCR " + new Date().toLocaleTimeString("es-GT"), 45, 248);

            return c.toDataURL("image/png");
        }

        function createCleanCapturedSelfieDataUrl() {
            const c = document.createElement("canvas");
            c.width = 400;
            c.height = 400;
            const ctx = c.getContext("2d");

            const grad = ctx.createRadialGradient(200, 180, 30, 200, 200, 220);
            grad.addColorStop(0, "#0A3D73");
            grad.addColorStop(1, "#001B36");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 400, 400);

            ctx.fillStyle = "#E2E8F0";
            ctx.beginPath();
            ctx.arc(200, 150, 56, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#00AEEA";
            ctx.beginPath();
            ctx.arc(200, 330, 105, Math.PI * 1.13, Math.PI * 1.87);
            ctx.fill();

            ctx.strokeStyle = "#10B981";
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 5]);
            ctx.beginPath();
            ctx.arc(200, 185, 130, 0, Math.PI * 2);
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.fillStyle = "#10B981";
            ctx.font = "bold 14px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("LIVENESS 3D: 99.8% VERIFICADO", 200, 365);

            return c.toDataURL("image/png");
        }

        function hideStepToast() {
            const toastEl = document.getElementById("step-toast");
            if (toastTimeoutId) clearTimeout(toastTimeoutId);
            if (toastEl) toastEl.classList.remove("show");
        }

        function showStepToast(cfg) {
            const toastEl = document.getElementById("step-toast");
            const textEl = document.getElementById("progress-text");
            const iconEl = document.getElementById("step-toast-icon");
            const watermarkEl = document.getElementById("progress-watermark");

            if (toastTimeoutId) clearTimeout(toastTimeoutId);
            if (!toastEl || !textEl || !iconEl) return;

            toastEl.classList.remove("show");

            if (!cfg || cfg.hideToast || !cfg.msg) {
                if (watermarkEl) {
                    watermarkEl.innerText = "";
                    watermarkEl.style.display = "none";
                }
                return;
            }

            if (watermarkEl) {
                watermarkEl.innerText = cfg.msg;
                watermarkEl.style.display = "inline";
            }

            const visuals = getToastTypeVisuals(cfg.type);

            setTimeout(() => {
                textEl.innerText = cfg.msg;
                textEl.style.color = visuals.color;
                iconEl.innerHTML = visuals.svg;
                iconEl.style.background = "transparent";
                toastEl.style.background = "#FFFFFF";
                toastEl.style.borderColor = visuals.border;
                toastEl.classList.add("show");

                toastTimeoutId = setTimeout(() => {
                    toastEl.classList.remove("show");
                }, 4200);
            }, 60);
        }

        // TOASTS DE ENTORNO EN EL PASO 6 (ILUMINACIÓN Y DISTORSIÓN EN EL FONDO)
        function mostrarToastAmbienteSelfie(tipo) {
            if (tipo === "ILUMINACION") {
                showStepToast({
                    type: "warning",
                    msg: "No hay suficiente iluminación"
                });
            } else if (tipo === "DISTORSION") {
                showStepToast({
                    type: "danger",
                    msg: "Hay mucha distorsión en el fondo"
                });
            }
        }

        function jumpToPhase(phase) {
            stopActiveCamera();
            const overlay = document.getElementById("selfie-blur-overlay");
            if (overlay) overlay.classList.remove("active");

            const view = document.getElementById("app-dynamic-view");
            if (view) view.style.padding = "20px 18px 16px";

            currentStep = phase;
            const stepTag = document.getElementById("app-step-tag");
            const displayStep = getDisplayStepNumber(phase);

            if (displayStep === null) {
                stepTag.style.display = "none";
                stepTag.innerText = "";
            } else {
                stepTag.style.display = "inline-block";
                stepTag.innerText = displayStep + "/13";
            }

            const indicator = document.getElementById("progress-indicator");
            const cfg = getProgressConfig(phase);
            const pct = displayStep === null ? 0 : Math.min(100, Math.round((displayStep / 13) * 100));

            if (indicator) {
                indicator.style.width = pct + "%";
                indicator.style.background = "linear-gradient(90deg, #FFC700 0%, #00AEEA 50%, #002D59 100%)";
            }

            showStepToast(cfg);
            renderView();
        }

        function appGoBack() {
            if (currentStep === 4) {
                jumpToPhase(2);
            } else if (currentStep === 15) {
                jumpToPhase(13);
            } else if (currentStep === 14) {
                jumpToPhase(15);
            } else if (currentStep > 1) {
                jumpToPhase(currentStep - 1);
            }
        }

            chipEl.classList.toggle("selected");
            const arr = session.preferencias[category];
            if (arr.includes(value)) {

            } else {
                arr.push(value);

        function validarCredencialesPaso9() {
            const btn = document.getElementById("btn-pwd");
            if (!btn) return;

            if (session.usaPin6Digitos) {
                const p1 = (document.getElementById("pin6-input")?.value || "").trim();
                const p2 = (document.getElementById("pin6-confirm")?.value || "").trim();
                const valido = p1.length === 6 && /^\d{6}$/.test(p1) && p1 === p2;
                btn.style.opacity = valido ? "1" : "0.5";
                btn.style.pointerEvents = valido ? "auto" : "none";
            } else {
                const val = document.getElementById("pwd-input")?.value || "";
                const conf = document.getElementById("pwd-confirm")?.value || "";
                const rL = document.getElementById("req-len");
                const rU = document.getElementById("req-up");
                const rN = document.getElementById("req-num");
                const rS = document.getElementById("req-sym");

                let vL = val.length >= 8;
                let vU = /[A-Z]/.test(val);
                let vN = /[0-9]/.test(val);
                let vS = /[^A-Za-z0-9]/.test(val);

                if (rL) { rL.innerHTML = vL ? "✅ Mínimo 8 caracteres" : "❌ Mínimo 8 caracteres"; rL.style.color = vL ? "var(--success)" : "var(--danger)"; }
                if (rU) { rU.innerHTML = vU ? "✅ Una letra mayúscula" : "❌ Una letra mayúscula"; rU.style.color = vU ? "var(--success)" : "var(--danger)"; }
                if (rN) { rN.innerHTML = vN ? "✅ Un número" : "❌ Un número"; rN.style.color = vN ? "var(--success)" : "var(--danger)"; }
                if (rS) { rS.innerHTML = vS ? "✅ Un símbolo (!@#$%)" : "❌ Un símbolo (!@#$%)"; rS.style.color = vS ? "var(--success)" : "var(--danger)"; }

                const coincide = conf.length === 0 || val === conf;
                if (vL && vU && vN && vS && coincide) {
                    btn.style.opacity = "1";
                    btn.style.pointerEvents = "auto";
                } else {
                    btn.style.opacity = "0.5";
                    btn.style.pointerEvents = "none";
                }
            }
        }

        function procesarSelfieDesdeDataUrl(selfieDataUrl) {
            const overlay = document.getElementById("selfie-blur-overlay");
            const circle = document.getElementById("selfie-spotlight-circle");
            const titleEl = document.getElementById("selfie-overlay-title");
            const statusEl = document.getElementById("selfie-overlay-status");
            const btnCapture = document.getElementById("btn-trigger-selfie-capture");
            const beam = document.getElementById("selfie-live-beam");
            const flash = document.getElementById("selfie-live-flash");
            const canvasEl = document.getElementById("selfie-live-canvas");
            const reticle = document.getElementById("selfie-clean-reticle");

            if (overlay && !overlay.classList.contains("active")) {
                overlay.classList.add("active");
            }
            if (btnCapture) btnCapture.style.display = "none";
            if (reticle) reticle.style.display = "none";

            if (flash) {
                flash.classList.add("flash");
                setTimeout(() => flash.classList.remove("flash"), 240);
            }

            stopActiveCamera();

            if (canvasEl && selfieDataUrl) {
                const img = new Image();
                img.onload = () => {
                    canvasEl.width = img.width || 400;
                    canvasEl.height = img.height || 400;
                    canvasEl.getContext("2d").drawImage(img, 0, 0, canvasEl.width, canvasEl.height);
                    canvasEl.style.display = "block";
                };
                img.src = selfieDataUrl;
            }

            if (circle) circle.classList.add("scanning");
            if (beam) beam.style.display = "block";
            if (titleEl) titleEl.innerText = "Escaneando biometría facial...";
            if (statusEl) {
                statusEl.innerText = "Verificando prueba de vida 3D...";
                statusEl.style.color = "var(--yellow)";
            }

            setTimeout(() => {
                if (beam) beam.style.display = "none";
                if (circle) {
                    circle.classList.remove("scanning");
                    circle.classList.add("success");
                }
                if (titleEl) titleEl.innerText = "¡Captura y escaneo exitoso!";
                if (statusEl) {
                    statusEl.innerText = "✓ Biometría verificada con éxito (99.8%)";
                    statusEl.style.color = "var(--success)";
                }

                setTimeout(() => {
                    session.fotos.selfie = selfieDataUrl;
                    if (overlay) overlay.classList.remove("active");
                    renderView();
                }, 1100);
            }, 2000);
        }

        function ejecutarCapturaSelfieCircular() {
            const canvasEl = document.getElementById("selfie-live-canvas");
            const captured = captureFrameToCanvas("selfie-live-video", "selfie-live-canvas", true);
            let selfieDataUrl = null;
            if (captured && canvasEl) {
                selfieDataUrl = canvasEl.toDataURL("image/png");

        function procesarDpiDesdeDataUrl(isFront, fotoDataUrl) {
            const frameId = isFront ? "dpi-front-frame" : "dpi-back-frame";
            const lineId = isFront ? "dpi-front-line" : "dpi-back-line";
            const statusId = isFront ? "dpi-front-status" : "dpi-back-status";
            const canvasId = isFront ? "dpi-front-canvas" : "dpi-back-canvas";
            const flashId = isFront ? "dpi-front-flash" : "dpi-back-flash";
            const reticleId = isFront ? "dpi-front-reticle" : "dpi-back-reticle";

            const frame = document.getElementById(frameId);
            const line = document.getElementById(lineId);
            const stat = document.getElementById(statusId);
            const btn = document.getElementById(isFront ? "btn-scan-frente" : "btn-scan-atras");
            const flash = document.getElementById(flashId);
            const canvasEl = document.getElementById(canvasId);
            const reticle = document.getElementById(reticleId);

            if (reticle) reticle.style.display = "none";

            if (flash) {
                flash.classList.add("flash");
                setTimeout(() => flash.classList.remove("flash"), 220);
            }

            stopActiveCamera();

            if (canvasEl && fotoDataUrl) {
                const img = new Image();
                img.onload = () => {
                    canvasEl.width = img.width || 480;
                    canvasEl.height = img.height || 300;
                    canvasEl.getContext("2d").drawImage(img, 0, 0, canvasEl.width, canvasEl.height);
                    canvasEl.style.display = "block";
                };
                img.src = fotoDataUrl;
            }

            if (isFront) {
                session.fotos.dpiFrente = fotoDataUrl;
            } else {
                session.fotos.dpiReverso = fotoDataUrl;
            }

            if (frame) frame.classList.add("scanning");
            if (line) line.style.display = "block";
            if (stat) {
                stat.innerText = "Escaneando lectura óptica OCR...";
                stat.style.color = "var(--yellow)";
            }
            if (btn) btn.style.display = "none";

            setTimeout(() => {
                if (line) line.style.display = "none";
                if (frame) {
                    frame.classList.remove("scanning");
                    frame.classList.add("success");
                }
                if (stat) {
                    stat.innerText = "✓ Captura y lectura exitosa";
                    stat.style.color = "var(--success)";
                }
                
                setTimeout(() => {
                    if (isFront) jumpToPhase(5);
                    else jumpToPhase(6);
                }, 1000);
            }, 1900);
        }

        function iniciarEscaneo(isFront) {

            }
            procesarDpiDesdeDataUrl(isFront, fotoDataUrl);
        }

        function copiarCuentaACH() {
            const numeroACH = "1500014400271005";
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(numeroACH).catch(() => {});
            } else {
                const temp = document.createElement("input");
                temp.value = numeroACH;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand("copy");
                document.body.removeChild(temp);
            }
            const btnCopy = document.getElementById("btn-copy-ach");

        function updateFuenteDedicacion(id, val) {
            const fuente = fuentesIngresosList.find(f => f.id === id);
            if (fuente) fuente.dedicacion = val;
        }

        function updateFuenteDesc(id, val) {
            const fuente = fuentesIngresosList.find(f => f.id === id);
            if (fuente) fuente.descripcion = val;

            if (fuentesIngresosList.length < 5) {
